name: Trustify performance tests

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Which test to run
        type: choice
        options: [daily, branch, pr]
        default: daily
        required: true
      source_repository:
        description: Trustify repository to check out (PR mode)
        type: string
        required: false
      source_sha:
        description: Trustify commit to test (PR mode)
        type: string
        required: false
      source_ref:
        description: Trustify branch name for report metadata (PR mode)
        type: string
        required: false
      pr_number:
        description: Trustify pull request number (PR mode)
        type: string
        required: false
      branch:
        description: Trustify branch to test (branch mode)
        type: string
        required: false
      dataset:
        description: "full or a ZIP under etc/datasets (e.g. etc/datasets/ds3.zip)"
        type: string
        default: full
        required: true
      duration:
        description: Locust duration (use 1m for a quick runner check)
        type: string
        default: 10m
        required: true

permissions:
  contents: read

concurrency:
  group: run
  cancel-in-progress: false
  queue: max

jobs:
  run:
    if: github.event_name == 'schedule' || inputs.mode == 'daily' || inputs.mode == 'branch' || inputs.mode == 'pr'
    env:
      DATASET: ${{ inputs.dataset || 'full' }}
      DURATION: ${{ inputs.duration || '10m' }}
      COMPOSE_PROJECT_NAME: ${{ (inputs.dataset || 'full') == 'full' && 'scale' || 'scale-dataset' }}
    runs-on:
      group: perf
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.meta.outputs.mode }}
      run_dir: ${{ steps.meta.outputs.run_dir }}
      publish_dir: ${{ steps.meta.outputs.publish_dir }}
    steps:
      - name: Check test inputs
        if: inputs.mode == 'pr'
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          test -n "$SOURCE_REPOSITORY" || { echo "source_repository is required in PR mode"; exit 1; }
          test -n "$SOURCE_SHA" || { echo "source_sha is required in PR mode"; exit 1; }
          test -n "$PR_NUMBER" || { echo "pr_number is required in PR mode"; exit 1; }

      - name: Check branch input
        if: inputs.mode == 'branch'
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          test -n "$BRANCH" || { echo "branch is required in branch mode"; exit 1; }
          git check-ref-format --branch "$BRANCH"

      - name: Check dataset and duration inputs
        id: inputs
        env:
          DATASET: ${{ env.DATASET }}
          DURATION: ${{ env.DURATION }}
        run: |
          if [[ ! "$DURATION" =~ ^[1-9][0-9]*[smhd]$ ]]; then
            echo "Duration must look like 30s, 1m, or 2h" >&2
            exit 1
          fi

          dataset_file=
          dataset_label="scale-20260317T023702Z"
          if [[ "$DATASET" != full ]]; then
            case "$DATASET" in
              etc/datasets/*.zip) dataset_file="${DATASET#etc/datasets/}" ;;
              *.zip) dataset_file="$DATASET" ;;
              *) echo "Dataset must be 'full' or a ZIP in etc/datasets/" >&2; exit 1 ;;
            esac
            if [[ ! "$dataset_file" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*\.zip$ ]]; then
              echo "Dataset ZIP must be a simple filename under etc/datasets/" >&2
              exit 1
            fi
            dataset_label="$dataset_file"
          fi
          {
            echo "dataset_file=$dataset_file"
            echo "dataset_label=$dataset_label"
          } >> "$GITHUB_OUTPUT"

      - name: Check out scale-test-runs
        uses: actions/checkout@v6
        with:
          path: scale

      - name: Check out Trustify
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.source_repository || 'guacsec/trustify' }}
          ref: ${{ inputs.mode == 'branch' && inputs.branch || inputs.source_sha || 'main' }}
          path: trustify
          persist-credentials: false

      - name: Maximize build space
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          for path in "${JAVA_HOME_8_X64:-}" "${JAVA_HOME_11_X64:-}" "${JAVA_HOME_17_X64:-}" "${RUBY_PATH:-}"; do
            if [ -n "$path" ]; then sudo rm -rf "$path"; fi
          done

      - name: Prepare ZIP dataset
        if: env.DATASET != 'full'
        env:
          DATASET_FILE: ${{ steps.inputs.outputs.dataset_file }}
        run: |
          zip_path="$GITHUB_WORKSPACE/trustify/etc/datasets/$DATASET_FILE"
          if [ -f "$zip_path" ]; then
            exit 0
          fi

          source_dir="${zip_path%.zip}"
          if [ ! -d "$source_dir" ]; then
            echo "Dataset ZIP and source directory not found: $zip_path" >&2
            exit 1
          fi

          docker run --rm \
            --volume "$GITHUB_WORKSPACE/trustify:/trustify" \
            --env DATASET_FILE \
            python:3.13-slim python -c '
          import os
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          root = Path("/trustify/etc/datasets")
          source = root / Path(os.environ["DATASET_FILE"]).stem
          target = root / os.environ["DATASET_FILE"]
          with ZipFile(target, "w", ZIP_DEFLATED) as archive:
              for path in source.rglob("*"):
                  if path.is_file():
                      archive.write(path, path.relative_to(source))
          '

      - name: Set run metadata
        id: meta
        env:
          MODE: ${{ github.event_name == 'schedule' && 'daily' || inputs.mode }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BRANCH: ${{ inputs.branch }}
          DATASET_LABEL: ${{ steps.inputs.outputs.dataset_label }}
        run: |
          source_sha=${SOURCE_SHA:-$(git -C trustify rev-parse HEAD)}
          short_sha=${source_sha:0:7}
          timestamp=$(date -u +%Y-%m-%dT%H-%M-%S)
          if [ "$MODE" = pr ]; then
            run_dir="pr_${PR_NUMBER}_${timestamp}_${short_sha}"
            publish_dir="pr"
            branch_slug=""
          elif [ "$MODE" = branch ]; then
            branch_slug="${BRANCH#release/}"
            branch_slug="${branch_slug//\//-}"
            if [[ ! "$branch_slug" =~ ^[A-Za-z0-9._-]+$ || "$branch_slug" == "." || "$branch_slug" == ".." ]]; then
              echo "Branch name cannot be represented safely in a dashboard path: $BRANCH" >&2
              exit 1
            fi
            run_dir="branch_${branch_slug}_${timestamp}_${short_sha}"
            publish_dir="branches/${branch_slug}/daily"
          else
            run_dir="${timestamp}_${short_sha}"
            publish_dir="daily"
            branch_slug=""
          fi
          {
            echo "mode=$MODE"
            echo "run_dir=$run_dir"
            echo "publish_dir=$publish_dir"
            echo "branch_slug=$branch_slug"
            echo "dataset=$DATASET_LABEL"
          } >> "$GITHUB_OUTPUT"

      - name: Build scale stack
        working-directory: scale
        env:
          SCALE_REV: ${{ inputs.mode == 'pr' && format('pr/{0}', inputs.pr_number) || (inputs.mode == 'branch' && inputs.branch) || 'main' }}
        run: |
          docker compose -f compose.yaml build \
            --build-arg rev="$SCALE_REV" \
            trustify-migrate trustify

      - name: Start scale stack
        working-directory: scale
        run: |
          docker compose -f compose.yaml down --remove-orphans
          for volume in trustify-db trustify-data; do
            docker volume rm "${COMPOSE_PROJECT_NAME}_${volume}" 2>/dev/null || true
          done

          if [[ "$DATASET" == full ]]; then
            docker compose -f compose.yaml up -d --wait trustify
          else
            docker compose -f compose.yaml up -d --wait postgres keycloak
            docker compose -f compose.yaml run --rm --no-deps init-keycloak
            docker compose -f compose.yaml run --rm --no-deps trustify-migrate
            docker compose -f compose.yaml up -d --no-deps --wait trustify
          fi

      - name: Vacuum and analyze after migrations
        working-directory: scale
        run: |
          docker compose -f compose.yaml exec -T postgres psql \
            -U postgres -d trustify -v ON_ERROR_STOP=1 -c 'VACUUM ANALYZE;'

      - name: Run Locust
        working-directory: trustify/tools/perf
        env:
          RUN_MODE: ${{ steps.meta.outputs.mode }}
          RUN_DIR: ${{ steps.meta.outputs.run_dir }}
          BRANCH_SLUG: ${{ steps.meta.outputs.branch_slug }}
          DATASET: ${{ env.DATASET }}
          DATASET_FILE: ${{ steps.inputs.outputs.dataset_file }}
          DATASET_LABEL: ${{ steps.meta.outputs.dataset }}
          DURATION: ${{ env.DURATION }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository || 'guacsec/trustify' }}
          SOURCE_REF: ${{ inputs.mode == 'branch' && inputs.branch || inputs.source_ref || 'main' }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          ISSUER_URL: http://keycloak:8080/realms/trustify
          CLIENT_ID: walker
          # Matches the local-only dummy credential in scale/compose.yaml.
          CLIENT_SECRET: R8A6KFeyxJsMDBhjfHbpZTIF0GWt43HP
          TOOLS_PERF_SCENARIO_FILE: ${{ env.DATASET == 'full' && 'etc/scenarios/main/full-20260317T023702Z.json5' || '' }}
          DATASET_UPLOAD_SCRIPT: |
            import os
            import requests
            from auth import create_provider

            token = create_provider().get_token()
            with open("/dataset.zip", "rb") as dataset:
                response = requests.post(
                    "http://trustify:8080/api/v3/dataset",
                    headers={"Authorization": f"Bearer {token}", "Content-Type": "application/zip"},
                    data=dataset,
                    timeout=1800,
                )
            response.raise_for_status()
            print(f"Imported {os.environ['DATASET_LABEL']}")
          TOOLS_PERF_WAIT_TIME_FROM: "0"
          TOOLS_PERF_WAIT_TIME_TO: "0"
        run: |
          mkdir -p out
          trustify_container=$(docker compose -f "$GITHUB_WORKSPACE/scale/compose.yaml" ps -q trustify)
          network=$(docker inspect --format '{{range $name, $network := .NetworkSettings.Networks}}{{$name}}{{end}}' "$trustify_container")
          test -n "$network" || { echo "Could not find the Trustify Compose network"; exit 1; }

          run_locust() {
            dataset_mount=()
            if [[ "$DATASET" != full ]]; then
              dataset_mount=(--volume "$GITHUB_WORKSPACE/trustify/etc/datasets/$DATASET_FILE:/dataset.zip:ro")
            fi
            docker run --rm \
              --network "$network" \
              --volume "$GITHUB_WORKSPACE/trustify/tools/perf:/perf" \
              "${dataset_mount[@]}" \
              --workdir /perf \
              --env ISSUER_URL \
              --env CLIENT_ID \
              --env CLIENT_SECRET \
              --env DATASET \
              --env DATASET_LABEL \
              --env DATASET_UPLOAD_SCRIPT \
              --env TOOLS_PERF_SCENARIO_FILE \
              --env TOOLS_PERF_WAIT_TIME_FROM \
              --env TOOLS_PERF_WAIT_TIME_TO \
              python:3.13-slim \
              sh -ec '
                pip install --disable-pip-version-check --no-cache-dir "locust==2.37.5" "json5==0.12.0"
                python -c "from auth import create_provider; import requests; token = create_provider().get_token(); response = requests.get(\"http://trustify:8080/api/v3/importer?total=true\", headers={\"Authorization\": f\"Bearer {token}\"}, timeout=30); response.raise_for_status(); print(\"OIDC authentication preflight passed\")"
                if [ "$DATASET" != full ]; then
                  python -c "$DATASET_UPLOAD_SCRIPT"
                fi
                exec locust "$@"
              ' locust "$@"
          }

          source_sha=${SOURCE_SHA:-$(git -C ../.. rev-parse HEAD)}
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "$RUN_MODE" = pr ]; then
            jq -n \
              --arg kind pull-request \
              --arg pr "$PR_NUMBER" \
              --arg pr_url "https://github.com/guacsec/trustify/pull/$PR_NUMBER" \
              --arg branch "$SOURCE_REF" \
              --arg commit "$source_sha" \
              --arg commit_url "https://github.com/$SOURCE_REPOSITORY/commit/$source_sha" \
              --arg dataset "$DATASET_LABEL" \
              --arg scenario "$TOOLS_PERF_SCENARIO_FILE" \
              --arg run_url "$run_url" \
              '{kind: $kind, pr: $pr, pr_url: $pr_url, branch: $branch, commit: $commit, commit_url: $commit_url, dataset: $dataset, scenario: $scenario, run_url: $run_url}' \
              > out/metadata.json
            run_locust \
              --host http://trustify:8080 \
              -u 10 -r 2 -t "$DURATION" \
              --headless \
              --html=out/report.html \
              --csv=out/results \
              --csv-full-history
          elif [ "$RUN_MODE" = branch ]; then
            jq -n \
              --arg kind branch-daily \
              --arg branch "$SOURCE_REF" \
              --arg branch_slug "$BRANCH_SLUG" \
              --arg commit "$source_sha" \
              --arg commit_url "https://github.com/guacsec/trustify/commit/$source_sha" \
              --arg dataset "$DATASET_LABEL" \
              --arg scenario "$TOOLS_PERF_SCENARIO_FILE" \
              --arg run_url "$run_url" \
              '{kind: $kind, branch: $branch, branch_slug: $branch_slug, commit: $commit, commit_url: $commit_url, dataset: $dataset, scenario: $scenario, run_url: $run_url}' \
              > out/metadata.json
            run_locust \
              --host http://trustify:8080 \
              -u 10 -r 2 -t "$DURATION" \
              --headless \
              --html=out/report.html \
              --csv=out/results \
              --csv-full-history \
              --exit-code-on-error 0
          else
            jq -n \
              --arg kind daily \
              --arg dataset "$DATASET_LABEL" \
              --arg scenario "$TOOLS_PERF_SCENARIO_FILE" \
              --arg branch main \
              --arg commit "$source_sha" \
              --arg commit_url "https://github.com/guacsec/trustify/commit/$source_sha" \
              --arg run_url "$run_url" \
              '{kind: $kind, dataset: $dataset, scenario: $scenario, branch: $branch, commit: $commit, commit_url: $commit_url, run_url: $run_url}' \
              > out/metadata.json
            run_locust \
              --host http://trustify:8080 \
              -u 10 -r 2 -t "$DURATION" \
              --headless \
              --html=out/report.html \
              --csv=out/results \
              --csv-full-history \
              --exit-code-on-error 0
          fi

      - name: Collect scale logs
        if: always()
        working-directory: scale
        run: docker compose -f compose.yaml logs > containers.log || true

      - name: Stop scale stack
        if: always()
        working-directory: scale
        run: |
          docker compose -f compose.yaml down --remove-orphans || true
          for volume in trustify-db trustify-data; do
            docker volume rm "${COMPOSE_PROJECT_NAME}_${volume}" 2>/dev/null || true
          done

      - name: Upload Locust results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locust-${{ steps.meta.outputs.run_dir }}
          path: trustify/tools/perf/out/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload scale logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scale-logs-${{ steps.meta.outputs.run_dir }}
          path: scale/containers.log
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: run
    if: needs.run.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Check out scale-test-runs
        uses: actions/checkout@v6
        with:
          ref: main
          path: scale

      - name: Check out Trustify report generator
        uses: actions/checkout@v6
        with:
          repository: guacsec/trustify
          ref: main
          path: trustify-report
          persist-credentials: false

      - name: Download Locust results
        uses: actions/download-artifact@v4
        with:
          name: locust-${{ needs.run.outputs.run_dir }}
          path: scale/publish/perf/${{ needs.run.outputs.publish_dir }}/runs/${{ needs.run.outputs.run_dir }}

      - name: Compress CSV results
        working-directory: scale
        env:
          PUBLISH_DIR: ${{ needs.run.outputs.publish_dir }}
          RUN_DIR: ${{ needs.run.outputs.run_dir }}
        run: gzip -9 "publish/perf/$PUBLISH_DIR/runs/$RUN_DIR"/*.csv

      - name: Build dashboard
        working-directory: scale
        env:
          MODE: ${{ needs.run.outputs.mode }}
          PUBLISH_DIR: ${{ needs.run.outputs.publish_dir }}
          BRANCH: ${{ inputs.branch }}
        run: |
          if [ "$MODE" = pr ]; then
            title="Trustify PR perf tests"
            target="trustify (scale snapshot)"
          elif [ "$MODE" = branch ]; then
            title="Trustify branch daily perf tests"
            target="trustify ($BRANCH, scale snapshot)"
          else
            title="Trustify load tests"
            target="trustify (scale snapshot, CI)"
          fi
          python3 ../trustify-report/tools/perf/locust_report.py \
            index "publish/perf/$PUBLISH_DIR/runs" -o "publish/perf/$PUBLISH_DIR" --prune \
            --title "$title" --target "$target"

      - name: Write branch index
        if: needs.run.outputs.mode == 'branch'
        working-directory: scale
        run: |
          python3 - <<'PY'
          from html import escape
          from pathlib import Path

          root = Path("publish/perf/branches")
          branches = sorted(path.name for path in root.iterdir() if path.is_dir())
          links = "\n".join(
              f'<li><a href="{escape(branch)}/daily/">{escape(branch)}</a></li>'
              for branch in branches
          )
          page = (
              '<!doctype html><html lang="en"><head><meta charset="utf-8">'
              '<meta name="viewport" content="width=device-width,initial-scale=1">'
              '<title>Trustify branch perf tests</title></head><body>'
              '<h1>Trustify branch perf tests</h1><ul>'
              f'{links}</ul><p><a href="../">All perf tests</a></p></body></html>'
          )
          (root / "index.html").write_text(page, encoding="utf-8")
          PY

      - name: Write perf dashboard landing page
        working-directory: scale
        run: |
          mkdir -p publish/perf
          cat > publish/perf/index.html <<'EOF'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trustify perf tests</title></head>
          <body><h1>Trustify perf tests</h1>
          <ul><li><a href="daily/">Daily load tests</a></li>
          <li><a href="pr/">Pull request perf tests</a></li>
          <li><a href="branches/">Branch daily tests</a></li></ul>
          </body></html>
          EOF

      - name: Commit results to main
        working-directory: scale
        env:
          RUN_DIR: ${{ needs.run.outputs.run_dir }}
          MODE: ${{ needs.run.outputs.mode }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- publish/perf
          if git diff --cached --quiet; then
            echo "No dashboard changes to commit."
          else
            git commit -m "perf: publish $MODE run $RUN_DIR"
            for attempt in 1 2 3; do
              git push && break
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              git pull --rebase origin main
              sleep 5
            done
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: scale/publish

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
