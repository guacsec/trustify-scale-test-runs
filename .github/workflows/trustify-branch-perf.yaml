name: Trustify branch daily performance tests

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      dataset:
        description: "full or a ZIP under etc/datasets (e.g. etc/datasets/ds3.zip)"
        type: string
        default: full
        required: true
      duration:
        description: Locust duration (use 1m for a quick runner check)
        type: string
        default: 10m
        required: true

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    strategy:
      matrix:
        # Add release branches here to include them in the daily perf run.
        branch: [release/0.6.z,release/0.7.z]
    steps:
      - name: Start branch performance run
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ matrix.branch }}
          DATASET: ${{ inputs.dataset || 'full' }}
          DURATION: ${{ inputs.duration || '10m' }}
        run: >-
          gh workflow run trustify-perf.yaml
          --repo guacsec/trustify-scale-test-runs
          --ref main
          --field mode=branch
          --field branch="$BRANCH"
          --field dataset="$DATASET"
          --field duration="$DURATION"
