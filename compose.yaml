#
# Compose setup for running load tests in a repeatable fashion.
#
# The idea is to run and prepare all services (db, sso, …) and then run the trustify API server and load tests.
#
# As all services run on the same machine, we set resource requests and limits on the postgres and trustify instance.
# To ensure that they do get their required resources and won't get throttled due to issues with keycloak or the
# loadtests.
#

x-dump-timestamp: &dump-timestamp "20260212T154815"

services:
  postgres:
    image: docker.io/library/postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: "eggs"
      POSTGRES_DB: "trustify"
    restart: always
    shm_size: 1G
    deploy:
      resources:
        reservations:
          cpus: "2"
          memory: 2G
        limits:
          cpus: "2"
          memory: 2G
    healthcheck:
      test: [ "CMD", "pg_isready", "-h", "localhost", "-U", "postgres", "-d", "trustify" ]
      interval: 2s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: [ "start-dev" ]
    environment:
      - KC_DB=dev-file
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin123456
      - KC_HEALTH_ENABLED=true
    ports:
      - "8090:8080"
      - "9000:9000"
    deploy:
      resources:
        reservations:
          memory: 512M
        limits:
          memory: 512M
    healthcheck:
      test:
        - "CMD-SHELL"
        - |
          exec 3<>/dev/tcp/127.0.0.1/9000; \
          echo -e "GET /health/ready HTTP/1.1\r\nHost: localhost\r\n\r\n" >&3; \
          grep -q "HTTP/1.1 200 OK" <&3
      interval: 5s
      timeout: 5s
      retries: 20

  init-keycloak:
    image: quay.io/keycloak/keycloak:26.3
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      - KEYCLOAK_URL=http://keycloak:8080
      - KCADM_PATH=/opt/keycloak/bin/kcadm.sh
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin123456
      - REALM=trustify
      - INIT_DATA=/init-sso/data
      - CHICKEN_ADMIN=admin
      - CHICKEN_ADMIN_PASSWORD=admin123456
      - REDIRECT_URIS=["http://trustify:*", "http://trustify:*/", "http://trustify:*/*"]
      - WALKER_SECRET=R8A6KFeyxJsMDBhjfHbpZTIF0GWt43HP
    volumes:
      - ./config/init-sso:/init-sso:z
    entrypoint: /usr/bin/bash
    command: /init-sso/init.sh

  download-dumps:
    image: registry.access.redhat.com/ubi10/ubi:latest
    environment:
      DUMP_TIMESTAMP: *dump-timestamp
    volumes:
      - trustify-cache:/cache:z
    command:
      - bash
      - -exc
      - |
        set -euo pipefail

        mkdir -p /cache

        if [ ! -s /cache/dump.tar ]; then
          echo "Downloading dump.tar..."
          curl --retry 50 --retry-max-time 3600 -sSL "https://trustify-dumps.s3.eu-west-1.amazonaws.com/$${DUMP_TIMESTAMP}Z/dump.tar" -o /cache/dump.tar
        else
          echo "Using cached dump.tar"
        fi

        if [ ! -s /cache/dump.sql.gz ]; then
          echo "Downloading dump.sql.gz..."
          curl --retry 50 --retry-max-time 3600 -sSL "https://trustify-dumps.s3.eu-west-1.amazonaws.com/$${DUMP_TIMESTAMP}Z/dump.sql.gz" -o /cache/dump.sql.gz
        else
          echo "Using cached dump.sql.gz"
        fi

  init-storage:
    depends_on:
      download-dumps:
        condition: service_completed_successfully
    image: registry.access.redhat.com/ubi10/ubi:latest
    volumes:
      - trustify-data:/data:z
      - trustify-cache:/cache:z
    command:
      - bash
      - -exc
      - |
        # skip extraction if /data is already populated, to allow re-running generate-scenario
        if [ -n "$(ls -A /data 2>/dev/null)" ]; then
          echo "Storage already populated, skipping extraction"
        else
          tar --strip-components=5 -xvf /cache/dump.tar -C /data
        fi

  replay-dump:
    depends_on:
      postgres:
        condition: service_healthy
      download-dumps:
        condition: service_completed_successfully
    image: docker.io/library/postgres:17
    volumes:
      - trustify-cache:/cache:z
    environment:
      PGUSER: postgres
      PGPASSWORD: eggs
      PGHOST: postgres
      PGDATABASE: trustify
    command:
      - bash
      - -exc
      - |
        set -euo pipefail

        # skip import if DB is already populated, to allow re-running generate-scenario
        if psql -tAc "SELECT 1 FROM information_schema.tables WHERE table_name='sbom' LIMIT 1" | grep -q 1; then
          echo "Database already populated, skipping import"
        else
          echo "Importing dump"
          zcat /cache/dump.sql.gz | psql -v ON_ERROR_STOP=1
          echo "VACUUM ANALYZE; REINDEX database trustify;" | psql
        fi

  trustify-migrate:
    depends_on:
      replay-dump:
        condition: service_completed_successfully
      init-storage:
        condition: service_completed_successfully
    build:
      dockerfile: ./Containerfile.trustify
    environment:
      RUST_LOG: debug
      TRUSTD_DB_USER: postgres
      TRUSTD_DB_PASSWORD: eggs
      TRUSTD_DB_HOST: postgres
      TRUSTD_DB_NAME: trustify
      TRUSTD_STORAGE_FS_PATH: /data
    volumes:
      - trustify-data:/data:z
    command:
      - db
      - migrate

  trustify:
    depends_on:
      trustify-migrate:
        condition: service_completed_successfully
      init-keycloak:
        condition: service_completed_successfully
      replay-dump:
        condition: service_completed_successfully
      init-storage:
        condition: service_completed_successfully

    build:
      dockerfile: ./Containerfile.trustify

    environment:
      TRUSTD_DB_USER: postgres
      TRUSTD_DB_PASSWORD: eggs
      TRUSTD_DB_HOST: postgres
      TRUSTD_DB_NAME: trustify
      TRUSTD_STORAGE_FS_PATH: /data
      RUST_LOG: info
      NO_COLOR: "true"
      INFRASTRUCTURE_ENABLED: "true"
      HTTP_SERVER_BIND_ADDR: "::"
      UI_ISSUER_URL: http://keycloak:8080/realms/trustify
      AUTHENTICATOR_OIDC_CLIENT_IDS: frontend,walker
      AUTHENTICATOR_OIDC_ISSUER_URL: http://keycloak:8080/realms/trustify
    healthcheck:
      test: "curl --fail http://localhost:9010/health/live || exit 1"
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - trustify-data:/data:z
    command:
      - api
    ports:
      - "8080:8080"
    deploy:
      resources:
        reservations:
          cpus: "3"
          memory: "2G"
        limits:
          cpus: "3"
          memory: "2G"

  generate-scenario:
    depends_on:
      replay-dump:
        condition: service_completed_successfully
      trustify-migrate:
        condition: service_completed_successfully
    build:
      dockerfile: ./Containerfile.loadtests
    environment:
      GENERATE_SCENARIO: true
      DATABASE_URL: postgresql://postgres:eggs@postgres:5432/trustify # notsecret

  db-shell:
    depends_on:
      replay-dump:
        condition: service_completed_successfully
      trustify-migrate:
        condition: service_completed_successfully
    image: docker.io/library/postgres:17
    environment:
      PGUSER: postgres
      PGPASSWORD: eggs
      PGHOST: postgres
      PGDATABASE: trustify
    command:
      - psql

  loadtests:
    depends_on:
      trustify:
        condition: service_healthy
    build:
      dockerfile: ./Containerfile.loadtests
    environment:
      ISSUER_URL: http://keycloak:8080/realms/trustify
      CLIENT_ID: walker
      CLIENT_SECRET: R8A6KFeyxJsMDBhjfHbpZTIF0GWt43HP # notsecret
      WAIT_TIME_FROM: "0"
      WAIT_TIME_TO: "0"
      DUMP_TIMESTAMP: *dump-timestamp
    volumes:
      - ./report:/report:z
      - ./baseline:/baseline:z
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        env SCENARIO_FILE="/usr/local/share/scenarios/full-$${DUMP_TIMESTAMP}.json5" \
        /usr/local/bin/loadtest \
          --host http://trustify:8080 \
          -u 7 \
          --run-time 30m \
          --report-file /report/report.html \
          --report-file /report/report.json \
          --report-file /report/report.md \
          --baseline-file /baseline/baseline.json \
          --scenarios RestAPIUser,RestAPIUserSlow,RestAPIUserDelete

volumes:
  trustify-data:
  trustify-cache:
